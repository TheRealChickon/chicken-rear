org.gradle.jvmargs=-Xmx4g
android.useAndroidX=true
kotlin.code.style=official
# Reuse task outputs across clones, worktrees and branch switches (the build cache in ~/.gradle/caches/build-cache-1;
# Gradle removes entries unused for 7 days). A worktree of a commit already built elsewhere builds in seconds.
org.gradle.caching=true
# Skip the configuration phase when nothing in the build scripts changed. --no-configuration-cache turns it off
# for one run if a plugin or an init script ever refuses it.
org.gradle.configuration-cache=true
